name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check src/ tests/ scripts/

      - name: Mypy (type check)
        run: PYTHONPATH=src mypy src/ --ignore-missing-imports

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Unit tests only: reconciler/claim/backend/auditor logic runs with no
      # browser dependency. --ignore=tests/browser is load-bearing, not
      # cosmetic: pytest recurses into subdirectories by default, and
      # tests/browser/ needs a real Chromium this job never installs (kept
      # out deliberately, to keep this job fast) -- see the browser-tests
      # job below for that suite.
      - name: Run unit test suite
        run: PYTHONPATH=src pytest tests/ --ignore=tests/browser -q

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Fetch pinned TodoMVC snapshot
        run: scripts/setup_todomvc.sh

      # test_inconsistent_reload_rendering.py is excluded here on purpose:
      # it reproduces a real ~1-in-6-reload race in third-party code (see
      # docs/FINDINGS.md), so asserting it on every push would make this
      # job spuriously red about 1 run in 6 through no fault of this repo's
      # own code. Run it manually/periodically -- see its own docstring for
      # the command.
      - name: Run browser integration suite
        run: >
          PYTHONPATH=src pytest tests/browser/ -q
          --ignore=tests/browser/test_inconsistent_reload_rendering.py
